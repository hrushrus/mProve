<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mp-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#132c3b"/>
      <stop offset="100%" stop-color="#08141c"/>
    </linearGradient>
    <linearGradient id="mp-mic" x1="20" y1="12" x2="44" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ce0e6"/>
      <stop offset="100%" stop-color="#199fb1"/>
    </linearGradient>
    <linearGradient id="mp-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#e09000"/>
    </linearGradient>
  </defs>
  <!-- Squircle Badge -->
  <rect width="64" height="64" rx="15" fill="url(#mp-bg)"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="13.75" stroke="#3fc1cc" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Orbiting Motion Arc into Lacrosse Stick (Top-Right to Bottom-Left Lacrosse Head) -->
  <path d="M21 17C28 10.5 40 10.5 46.5 18C52.5 25 51.5 36.5 43.5 43.5L23 51" stroke="url(#mp-mic)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- Lacrosse Stick Head with Netting (Bottom-Left) -->
  <path d="M23 51L14.5 48.5C12.2 47.8 11.2 50.5 12.8 52.5L17.5 55.5C19.2 56.5 21.5 55 23 51Z" fill="#0d212d" stroke="#4ce0e6" stroke-width="2"/>
  <path d="M15 49.5L19.5 54.5M18 49.8L15 53.5M20.5 50.5L17.5 54.8" stroke="#4ce0e6" stroke-width="0.9" opacity="0.8"/>

  <!-- Crossed Ice Hockey Stick & Puck (Top-Left to Bottom-Right) -->
  <path d="M16 32L40 53.5L50 51" stroke="url(#mp-mic)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="45.5" cy="53" rx="3.4" ry="1.6" fill="#08141c" stroke="#4ce0e6" stroke-width="1.4"/>

  <!-- Subtle Swim Wave Tucked Underneath -->
  <path d="M21 46.5C25.5 44.2 30 47.5 34.5 45.5C39 43.5 42.5 46 45.5 44" stroke="#3fc1cc" stroke-width="2" stroke-linecap="round" opacity="0.65"/>

  <!-- Central Coach Microphone -->
  <rect x="25" y="15" width="12" height="18" rx="6" fill="#0d212d" stroke="url(#mp-mic)" stroke-width="2.8"/>
  <path d="M25.5 20.5H28M25.5 24H28M25.5 27.5H28M34 20.5H36.5M34 24H36.5M34 27.5H36.5" stroke="url(#mp-mic)" stroke-width="2" stroke-linecap="round"/>
  <path d="M21 26C21 31.5 25.5 36 31 36C36.5 36 41 31.5 41 26" stroke="url(#mp-mic)" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="31" y1="36" x2="31" y2="42.5" stroke="url(#mp-mic)" stroke-width="2.8" stroke-linecap="round"/>

  <!-- 4 Balls Along the Right Orbit Arc -->
  <!-- 1. Volleyball (Top) -->
  <g transform="translate(41.5, 14)">
    <circle cx="0" cy="0" r="3.8" fill="#4ce0e6" stroke="#08141c" stroke-width="0.9"/>
    <path d="M-3.2 0.4C-1 -1.4 1.4 -1.4 3.2 0.4M0 -3.5C1.1 -1 1.1 1.4 0 3.5" stroke="#08141c" stroke-width="0.9" stroke-linecap="round"/>
  </g>
  <!-- 2. Tennis Ball (Upper-Mid) -->
  <g transform="translate(47.8, 21.2)">
    <circle cx="0" cy="0" r="3.9" fill="#c8e636" stroke="#08141c" stroke-width="0.9"/>
    <path d="M-2.6 -2.6C-0.7 -1 -0.7 1 -2.6 2.6M2.6 -2.6C0.7 -1 0.7 1 2.6 2.6" stroke="#08141c" stroke-width="0.9" stroke-linecap="round"/>
  </g>
  <!-- 3. Soccer Ball (Lower-Mid) -->
  <g transform="translate(49, 30.2)">
    <circle cx="0" cy="0" r="4.3" fill="#e4eef1" stroke="#08141c" stroke-width="0.9"/>
    <polygon points="0,-2 1.9,-0.6 1.1,1.6 -1.1,1.6 -1.9,-0.6" fill="#08141c"/>
    <path d="M0 -2V-4.1M1.9 -0.6L4 -1.3M1.1 1.6L2.5 3.4M-1.1 1.6L-2.5 3.4M-1.9 -0.6L-4 -1.3" stroke="#08141c" stroke-width="0.8"/>
  </g>
  <!-- 4. Basketball (Bottom-Right) -->
  <g transform="translate(44.5, 39.2)">
    <circle cx="0" cy="0" r="4.6" fill="url(#mp-gold)" stroke="#08141c" stroke-width="0.9"/>
    <path d="M-4.3 0H4.3M0 -4.3V4.3M-3.1 -3.1C-1.2 -1.2 -1.2 1.2 -3.1 3.1M3.1 -3.1C1.2 -1.2 1.2 1.2 3.1 3.1" stroke="#08141c" stroke-width="0.9" stroke-linecap="round"/>
  </g>
</svg>
